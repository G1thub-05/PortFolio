
name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const username = "G1thub-05";
          const token = process.env.GITHUB_TOKEN;

          async function githubApi(url) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });

            if (!response.ok) {
              throw new Error(
                `GitHub API error: ${response.status} ${await response.text()}`
              );
            }

            return response;
          }

          async function getRepos() {
            let repos = [];
            let page = 1;

            while (true) {
              const response = await githubApi(
                `https://api.github.com/users/${username}/repos?type=owner&per_page=100&page=${page}`
              );

              const data = await response.json();
              repos.push(...data);

              if (data.length < 100) break;
              page++;
            }

            return repos;
          }

          async function getCommitCount(repo) {
            if (!repo.default_branch) return 0;

            const response = await githubApi(
              `https://api.github.com/repos/${username}/${repo.name}/commits?per_page=1`
            );

            const link = response.headers.get("Link");

            if (link) {
              const match = link.match(
                /[?&]page=(\d+)[^>]*>;\s*rel="last"/
              );

              if (match) return Number(match[1]);
            }

            const data = await response.json();
            return data.length;
          }

          async function main() {
            const repos = await getRepos();

            const totalStars = repos.reduce(
              (sum, repo) => sum + repo.stargazers_count,
              0
            );

            let totalCommits = 0;

            for (const repo of repos) {
              totalCommits += await getCommitCount(repo);
            }

            const stats = {
              repositories: repos.length,
              stars: totalStars,
              commits: totalCommits,
              updatedAt: new Date().toISOString()
            };

            fs.writeFileSync(
              "github-stats.json",
              JSON.stringify(stats, null, 2)
            );

            console.log("GitHub statistics updated:", stats);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub statistics"
            git push
          else
            echo "No statistics changes found."
          fi
